#  Lives at  sdsmtrobotics.github.io/news/2020-competition-cancellation-and-recap-of-year
#
#  All the words on this page are in this file. Change them here,
#  then run:      ./build.py
#
#  The photos are in the images/ folder next to this file. To add
#  one, drop the file in there and copy a [[post.photo]] block. To
#  reorder them, move the blocks.
#
#  Not sure which photo is which? Open  map.html  in this folder.
#
#  The wording every write-up shares - the link back to the news
#  page, the headings, the band at the bottom - is one folder up,
#  in  content/posts/config.toml.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title is built from the headline below.
[meta]
description = "A full-body spinning combat robot and a self-driving Traxxas running ROS on a Jetson Nano, both bound for the National Robotics Challenge until Covid-19 halted the season."


# --- THE STORY ----------------------------------------------------
#   title  - the headline. Also the browser tab title.
#   date   - the date line under the headline.
#   tag    - the small gold label above the headline.
#   intro  - the sentence under the headline. Links are allowed.
#   image  - a banner photo behind the headline: a filename from
#            images/. Left empty on purpose, so the page opens on a
#            plain navy band and the story starts higher up.
#
#   Keep title, date and intro in step with this story's card on the
#   news page, which is set in content/news/config.toml.
[post]
title = "2020 Competition Cancellation and Recap of Year"
date  = "May 11, 2020"
tag   = "NRC"
intro = "A full-body spinning combat robot and a self-driving Traxxas running ROS on a Jetson Nano, both headed for the National Robotics Challenge &mdash; until Covid-19 halted the season mid-spring."
image = ""


# ------------------------------------------------------------------
#  THE WRITE-UP, in the order it appears on the page.
#
#  Each [[post.block]] is one piece of the story and can hold any of:
#
#    heading - a sub-heading above the block
#    text    - the paragraphs, one entry per paragraph
#    list    - a bulleted list, one entry per bullet
#    image   - a filename in images/, shown full width
#    caption - the line under that image
#
#  Leave out what a block does not need. To move a picture, move its
#  block; to split a run of paragraphs around one, start a new block.
# ------------------------------------------------------------------

[[post.block]]
text = [
  "This year, the team chose to compete at the National Robotics Challenge (NRC). The National Robotics challenge is a yearly competition which comprises many different events. A full list of events and rules can be found <a href=\"https://drive.google.com/file/d/1fPCJIoOIDD9goh9XVxjR8urUGtvaePLB/view?usp=sharing\" target=\"_blank\" rel=\"noopener\">in the competition manual here</a>. The team chose to compete in the Combat Robot and Autonomous Vehicle Challenge (AVC) events.",
]

[[post.block]]
heading = "Combat"
text = [
  "The purpose of this competition is to construct a 14&quot; x 14&quot; x 14&quot; 3lb beetleweight robot. Two robots fight head-to-head in an enclosed 8&rsquo;x8&rsquo; arena until one of the bots becomes immobilized.",
  "The robot we designed for this was a full-body spinning robot. It is circular and the entire robot is designed to spin at approximately 400rpm. The primary weapon is a tooth sticking out of the side to hit the other robots.",
  "More information on this bot can be found on its <a href=\"/projects/spinnybot\">project page</a>.",
]

[[post.block]]
heading = "AVC"
text = [
  "The goal of this competition is to design and build a vehicle to autonomously navigate around a course. The course begins at a starting line, loops around four waypoints, and ends at the same location. Points are awarded based on speed of completing the course. Along the course are a hoop and ramp. Driving through the hoop or over the ramp will give bonus points. The course layout is shown below.",
]
image   = "avc-course.jpg"
caption = "The AVC course: four waypoints, with a ramp and a hoop for bonus points."

[[post.block]]
text = [
  "For the car body, the team decided to reuse an old Traxxas E-Revo Brushless Edition RC car from a previous competition. This chassis is capable of very high speeds and has good handling. The chassis was a bit beat up from previous use, so the team replaced damaged components with stronger aluminum ones. Also, in the process of interfacing our control system with the stock one, there was an unfortunate accident where the ESC met its demise. We replaced this with a newer stronger version as well.",
  "For the control system, the plan was to use a combination of computer vision, GPS, and IMU positioning. The core of the system was a Nvidia Jetson Nano running ROS. We chose this device since it has plenty of firepower for computer vision object detection and coordinating all of the inputs to establish location on the course. The Jetson interfaced with an Arduino Nano 33 BLE which communicated with the sensors, steering servos, and drive motor speed controller. Before our progress was halted, we were able to detect the waypoints using computer vision and establish location using GPS. We were also able to interface the RC car&rsquo;s control system with the Arduino and successfully drove the car autonomously some short distances.",
]

[[post.block]]
heading = "Status and Plans for Next Year"
text = [
  "Unfortunately, progress was halted mid-spring semester due to Covid-19. At that time, we would have been somewhat rushed to complete both challenges by the time of the competition, but we are confident we would have gotten it done.",
  "Fortunately, the challenges will be the same next year. As of now, our plan is to compete in the NRC competition once again so we will have the opportunity to finish these bots and compete with them. Since we will have a full year to work on this, we anticipate being able to greatly refine our designs and hopefully have an even stronger showing at the competition. We look forward to next year starting so that we can pick up where we left off.",
]


