####################################################################
#  NEWS WRITE-UP: Super Robo Time 2019
#  Lives at  sdsmtrobotics.github.io/news/super-robo-time-2019
#
#  All the words on this page are in this file. Change them here,
#  then run:      ./build.py
#
#  The photos are in the images/ folder next to this file. To add
#  one, drop the file in there and copy a [[post.photo]] block. To
#  reorder them, move the blocks.
#
#  Not sure which photo is which? Open  map.html  in this folder.
#
#  The wording every write-up shares - the link back to the news
#  page, the headings, the band at the bottom - is one folder up,
#  in  content/posts/config.toml.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title is built from the headline below.
[meta]
description = "The annual kick-off with UAS and the 3D Print Club: a lab scavenger hunt, then weeks of teams building battlebots out of the same box of parts."


# --- THE STORY ----------------------------------------------------
#   title  - the headline. Also the browser tab title.
#   date   - the date line under the headline.
#   tag    - the small gold label above the headline.
#   intro  - the sentence under the headline. Links are allowed.
#   image  - a banner photo behind the headline: a filename from
#            images/. Left empty on purpose, so the page opens on a
#            plain navy band and the story starts higher up.
#
#   Keep title, date and intro in step with this story's card on the
#   news page, which is set in content/news/config.toml.
[post]
title = "Super Robo Time 2019"
date  = "October 5, 2019"
tag   = "Super Robo Time"
intro = "Our annual kick-off with UAS and the 3D Print Club: a lab scavenger hunt, then a few weeks of teams building battlebots out of the same box of parts and fighting it out in the arena."
image = ""


# ------------------------------------------------------------------
#  THE WRITE-UP, in the order it appears on the page.
#
#  Each [[post.block]] is one piece of the story and can hold any of:
#
#    heading - a sub-heading above the block
#    text    - the paragraphs, one entry per paragraph
#    list    - a bulleted list, one entry per bullet
#    image   - a filename in images/, shown full width
#    caption - the line under that image
#
#  Leave out what a block does not need. To move a picture, move its
#  block; to split a run of paragraphs around one, start a new block.
# ------------------------------------------------------------------

[[post.block]]
text = [
  "This fall we held our annual Super Robo Time. Super Robo Time (SRT) is an annual event held by the Robotics Team, UAS, and 3D Print Club and is a chance for old, new, and potential members to learn.",
  "As in the past we did a scavenger hunt during the first day. This scavenger hunt has particpants search for items in the labs as well as accomplish tasks that might be useful as part of the robotics team, UAS, or 3D print club. Team &ldquo;Team&rdquo; ended up with a high score of 1645 points.",
  "Over the following weeks, participants split up into teams and developed robots to compete in the battlebot arena. The competition challenged teams to construct a robot from given materials to fight along with a partner against two other bots in the arena. The first team to either capture the opposing base or disable the opposing robots would win the round. The results of the competition on the final day were as follows.",
]
list = [
  "<strong>First place:</strong> Team Prime",
  "<strong>Second place:</strong> Team DYnamo",
  "<strong>Third place:</strong> Team Amazon",
  "<strong>Fourth place:</strong> A Team",
]

[[post.block]]
text = [
  "We would like to thank everyone who worked hard to make this a success. It was a fun event and a great way to kick off the semester.",
]


