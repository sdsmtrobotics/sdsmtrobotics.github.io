#  THE PHOTOGRAPHS, in the order they appear on the page.
#
#    image   - a filename in the images/ folder next to this file.
#    caption - shown under the photo when it is opened full size,
#              and read out to screen readers. Empty is fine; the
#              page falls back to "<headline>, photo 2".
#
#  Delete every one of these blocks and the photo band disappears.
# ------------------------------------------------------------------

