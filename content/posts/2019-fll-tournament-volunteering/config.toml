####################################################################
#  NEWS WRITE-UP: 2019 FLL Tournament Volunteering
#  Lives at  sdsmtrobotics.github.io/news/2019-fll-tournament-volunteering
#
#  All the words on this page are in this file. Change them here,
#  then run:      ./build.py
#
#  The photos are in the images/ folder next to this file. To add
#  one, drop the file in there and copy a [[post.photo]] block. To
#  reorder them, move the blocks.
#
#  Not sure which photo is which? Open  map.html  in this folder.
#
#  The wording every write-up shares - the link back to the news
#  page, the headings, the band at the bottom - is one folder up,
#  in  content/posts/config.toml.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title is built from the headline below.
[meta]
description = "Team members refereed the robot game and judged robot design at the regional FIRST LEGO League qualifier in Rapid City, a record 20 teams."


# --- THE STORY ----------------------------------------------------
#   title  - the headline. Also the browser tab title.
#   date   - the date line under the headline.
#   tag    - the small gold label above the headline.
#   intro  - the sentence under the headline. Links are allowed.
#   image  - a banner photo behind the headline: a filename from
#            images/. Left empty on purpose, so the page opens on a
#            plain navy band and the story starts higher up.
#
#   Keep title, date and intro in step with this story's card on the
#   news page, which is set in content/news/config.toml.
[post]
title = "2019 FLL Tournament Volunteering"
date  = "December 7, 2019"
tag   = "Outreach"
intro = "Members refereed the robot game and judged robot design at the regional FIRST LEGO League qualifier in Rapid City &mdash; a record 20 teams of 9 to 14 year olds."
image = ""


# ------------------------------------------------------------------
#  THE WRITE-UP, in the order it appears on the page.
#
#  Each [[post.block]] is one piece of the story and can hold any of:
#
#    heading - a sub-heading above the block
#    text    - the paragraphs, one entry per paragraph
#    list    - a bulleted list, one entry per bullet
#    image   - a filename in images/, shown full width
#    caption - the line under that image
#
#  Leave out what a block does not need. To move a picture, move its
#  block; to split a run of paragraphs around one, start a new block.
# ------------------------------------------------------------------

[[post.block]]
text = [
  "This Saturday some members of our team helped out with the regional FIRST lego league qualifier held in Rapid City.",
  "FIRST LEGO League is an educational extracurricular activity for youth ages 9-14. This event focuses on teamwork, societal challenges and STEM. Teams have been working together since August, learning to build and program competitive autonomous robots which must complete various tasks within a given time to earn points. This year&rsquo;s Rapid City event included a record number of 20 registered teams.",
  "Members from our team volunteered in various capacities such as robot game refs and robot design judges. Alex Fry served as the head ref and Samuel Ryckman served as the head robot design judge. We also helped set up the night before and clean up following the competition.",
  "It was really great to see kids so excited about robotics and STEM and we were glad to have the opportunity to help out with such a fantastic event.",
]


