####################################################################
#  ROBOTS PAGE  (sdsmtrobotics.github.io/projects)
#
#  Everything you can see as text on the robots page is in this
#  file. Change it here, then run:      ./build.py
#
#  Images live in the images/ folder next to this file. To swap one
#  out, drop the new photo in there and put its filename below.
#
#  Not sure which image is which? Open  map.html  in this folder.
#  It shows every photo and every block of text in page order.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title comes from _src/projects.html, not from here.
[meta]
description = "Every robot the South Dakota Mines Rocker Robotics Team has built - autonomous ground vehicles, sumo and combat robots, ASME competition machines, custom controllers, and more."


# --- PAGE HEAD: the banner at the top -----------------------------
# Set image = "" for a plain navy band instead of a photo.
[page_head]
image   = "banner.jpg"          # wide landscape photo, 1900px or wider
eyebrow = "What we build"
heading = "Our robots"
body    = "Every machine the team has designed, built, and programmed &mdash; from the autonomous ground vehicle we took to Michigan to the trebuchet that throws pumpkins down Main Street."


# --- THE ROBOT LIST -----------------------------------------------
[robots]
eyebrow = "The whole shelf"
heading = "Every robot we have built"
intro   = "Newest first. Each card opens the full write-up for that robot &mdash; the design, the build, the software, and how it did at competition."

# The buttons above the cards. Each one shows only the robots whose
# `category` matches its `value`. Leave `value = ""` for "show all".
#
# If you add a robot in a brand new category, add a button for it
# here too - otherwise its card only ever shows under "All robots".

[[robots.filter]]
label = "All robots"
value = ""

[[robots.filter]]
label = "RoboSub"
value = "robosub"

[[robots.filter]]
label = "IGVC"
value = "igvc"

[[robots.filter]]
label = "NRC"
value = "nrc"

[[robots.filter]]
label = "ASME"
value = "asme"

[[robots.filter]]
label = "Other builds"
value = "other"


# ------------------------------------------------------------------
#  Each [[robots.card]] block below is one robot, in the order they
#  appear on the page. Copy a block to add a robot, delete one to
#  remove it.
#
#    name      - the robot's name, shown as the card heading
#    tag       - small gold label in the corner of the photo
#    category  - which filter button shows this card. Must match one
#                of the `value` settings in the buttons above.
#    years     - the date line under the name
#    blurb     - the description. Links are allowed.
#    image     - filename in images/. Leave as "" to show a
#                "photos coming soon" placeholder instead.
#    link      - page the card opens. Leave as "" for no link.
#    link_text - the words on the link at the bottom of the card
# ------------------------------------------------------------------

[[robots.card]]
name       = "RoboSub"
tag        = "In progress"
category   = "robosub"
years      = "2025 &ndash; present"
blurb      = "Our first autonomous underwater vehicle, taking the team below the surface for the first time and into a new class of competition. This is the machine we are building now."
image      = ""
link       = ""
link_text  = "Details coming soon"

[[robots.card]]
name       = "T-Shirt Cannon Robot"
tag        = "Outreach"
category   = "other"
years      = "9/1/2020 &ndash; Ongoing"
blurb      = "What better way is there to promote our robotics team and our engineering school than to use a robot to shoot t-shirts into the crowd at promotional events? This robot is being designed exactly for that purpose: promoting the South Dakota School of Mines and Technology. Design began Fall of 2020, but construction was delayed due to a pandemic and all that jazz. Construction began Fall of 2021 where a prototype cannon was designed and constructed for testing effectiveness of the design."
image      = "t-shirt-cannon.jpg"
link       = "/projects/t-shirt-cannon"
link_text  = "View details"

[[robots.card]]
name       = "Sumobot 2025"
tag        = "NRC"
category   = "nrc"
years      = "9/7/2024 &ndash; 4/5/2025"
blurb      = "The purpose of this competition is to create a autonomous 20lb robot that will be placed in a ring and must push another bot out of the ring. You can visit the competition website here: <a href=\"https://www.thenrc.org/\" target=\"_blank\" rel=\"noopener\">NRC</a> and the rule book here: <a href=\"https://irp.cdn-website.com/9297868f/files/uploaded/NRCContestRules2025.pdf\" target=\"_blank\" rel=\"noopener\">NRC rules</a>."
image      = "sumobot-2025.jpg"
link       = "/projects/sumobot-2025"
link_text  = "View details"

[[robots.card]]
name       = "IGVC 2024"
tag        = "IGVC"
category   = "igvc"
years      = "9/30/2023 &ndash; 6/4/2024"
blurb      = "The main objective with this competition is to build a robot that can autonomously navigate around a course staying in-between white lines and avoiding obstacles in its path. You can visit the competition website here: <a href=\"http://www.igvc.org/\" target=\"_blank\" rel=\"noopener\">IGVC</a>. During the competition, we failed to qualify. Our design report can be found in the links section of the write-up."
image      = "igvc-2024.jpg"
link       = "/projects/igvc-year-2"
link_text  = "View details"

[[robots.card]]
name       = "IGVC 2023"
tag        = "IGVC"
category   = "igvc"
years      = "9/30/2022 &ndash; 6/5/2023"
blurb      = "The main objective with this competition is to build a robot that can autonomously navigate around a course staying in-between white lines and avoiding obstacles in its path. You can visit the competition website here: <a href=\"http://www.igvc.org/\" target=\"_blank\" rel=\"noopener\">IGVC</a>. We won 4th in the design portion of the competition. We also won the rookie of the year award. Our design report can be found in the links section of the write-up."
image      = "igvc-2023.jpg"
link       = "/projects/igvc"
link_text  = "View details"

[[robots.card]]
name       = "Spinnybot"
tag        = "NRC"
category   = "nrc"
years      = "9/1/2019 &ndash; 4/10/2022"
blurb      = "This robot was constructed to compete in the Combat Robot event at the 2020 NRC competition. The goal of this competition is to construct a 14&quot; x 14&quot; x 14&quot; 3lb beetleweight robot. Two robots fight head-to-head in an enclosed 8&rsquo;x8&rsquo; arena until one of the bots becomes immobilized. The robot we designed for this was a full-body spinning robot. It is circular and the entire robot is designed to spin at approximately 500rpm."
image      = "spinnybot.png"
link       = "/projects/spinnybot"
link_text  = "View details"

[[robots.card]]
name       = "AVC Car"
tag        = "NRC"
category   = "nrc"
years      = "1/13/2020 &ndash; 4/10/2022"
blurb      = "This bot was built and programmed for competing in the National Robotics Challenge (NRC) Autonomous Vehicle Competition (AVC). The purpose of this competition is to build and program a self-driving car that will navigate a course in the shortest time possible. Points are awarded for speed and also for successfully navigating through obstacles."
image      = "avc-car.jpg"
link       = "/projects/avc"
link_text  = "View details"

[[robots.card]]
name       = "Controller v2"
tag        = "Hardware"
category   = "other"
years      = "9/1/2018 &ndash; 3/16/2020"
blurb      = "Redesign of the previous controller. The goal of this version was to fix some of the issues with the previous version while adding some new features. Some of the improvements include: better battery life, integrated battery charger, more ergonomic case, and triggers and bumpers."
image      = "controller-v2.jpg"
link       = "/projects/controller-v2"
link_text  = "View details"

[[robots.card]]
name       = "B.A.M."
tag        = "ASME"
category   = "asme"
years      = "10/6/2018 &ndash; 4/8/2019"
blurb      = "B.A.M. (Ball Acquisition Machine) is a robot constructed for the 2019 ASME Student Design Competition. The goal of the competition was to collect balls of various sizes from 20cm tall tubes and dispense them into a 50cm x 50cm scoring area."
image      = "bam.jpg"
link       = "/projects/b-a-m"
link_text  = "View details"

[[robots.card]]
name       = "Swervebot"
tag        = "ASME"
category   = "asme"
years      = "11/29/2018 &ndash; 1/18/2019"
blurb      = "Swervebot is a drivetrain idea we had for the 2019 ASME Student Design Competition. Its main feature is a differential swerve drive system for omnidirectional motion. A standard swerve drive robot works by rotating wheels about their vertical axis so that they face in the direction the robot needs to move. This differential swerve drive design is more efficient since it does not require an additional motor for rotating the wheels (both motors are used for driving the robot)."
image      = "swervebot.png"
link       = "/projects/swervebot"
link_text  = "View details"

[[robots.card]]
name       = "Soccerbots"
tag        = "ASME"
category   = "asme"
years      = "9/1/2017 &ndash; 3/24/2018"
blurb      = "Robots created to compete in the 2018 ASME Student Design Competition. For this competition, we created three bots: two for defense and one for offense. The three robots were designed to fit together inside of an 18&rdquo; cube to meet the size requirements in the rules."
image      = "soccerbots.jpg"
link       = "/projects/soccerbots"
link_text  = "View details"

[[robots.card]]
name       = "Controller"
tag        = "Hardware"
category   = "other"
years      = "10/1/2017 &ndash; 3/24/2018"
blurb      = "Custom controller developed for use with the soccorbots for the 2018 ASME SDC. Even though the controller was designed for this purpose, the primary goal was to create a controller that could easily be used with any of our robots in the future. Designing it ourselves would give us complete control of how the controller behaves and sends information to the robot. The controller used an ATMEGA328P as the controller and an XBee-Pro 900hp for communications."
image      = "controller.jpg"
link       = "/projects/controller"
link_text  = "View details"

[[robots.card]]
name       = "Surface Mobility Platform and Mecanumbot"
tag        = "Platforms"
category   = "other"
years      = "1/1/2015 &ndash; 8/12/2015"
blurb      = "The SMPs and Mecanumbot were developed for three primary uses: learning and research, functional examples, and demos. The Surface Mobility Platform (SMP) is based on an all terrain chassis developed by Gears Educational Systems. The design incorporates independent suspension for the left and right sides of the robot. This chassis was modified by adding the silver motor-housings and beefier motors for more power."
image      = "smp-mecanumbot.jpg"
link       = "/projects/smp-and-mecanumbot"
link_text  = "View details"


# --- MORE TO SEE: the three cards under the robot list -------------
[more]
eyebrow = "Keep digging"
heading = "More from the shop"
intro   = "The write-ups are only part of it. The build logs, the photos, and the code all live somewhere."

# icon - any Font Awesome 4.7 name, without the "fa-" prefix.
#        Browse them at https://fontawesome.com/v4/icons/

[[more.card]]
icon      = "newspaper-o"
heading   = "Build logs and news"
body      = "Season write-ups, competition results, and what the team has been up to between them."
link      = "/news"
link_text = "Read the news"

[[more.card]]
icon      = "camera"
heading   = "Photos"
body      = "Competition trips, workdays in McLaury, outreach events, and a decade of robots in various states of assembly."
link      = "/gallery"
link_text = "Open the gallery"

[[more.card]]
icon      = "code"
heading   = "Our code"
body      = "Firmware, autonomy stacks, and computer vision for our robots are developed in the open."
link      = "https://github.com/sdsmt-robotics"
link_text = "Browse on GitHub"


# --- CONTACT BAR: the dark band at the bottom ---------------------
[contact_bar]
heading               = "Want to build the next one?"
body                  = "No experience required. Turn up to a meeting or a workday, tell us what you are curious about, and we will put a tool in your hand."
primary_button_text   = "Join the team"
primary_button_link   = "/about#join"
secondary_button_text = "Contact us"
secondary_button_link = "mailto:Robotics@mines.sdsmt.edu"
