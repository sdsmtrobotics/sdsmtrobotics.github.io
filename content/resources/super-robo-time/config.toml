####################################################################
#  SUPER ROBO TIME  (sdsmtrobotics.github.io/resources/super-robo-time)
#
#  Everything you can see as text on this page is in this file.
#  Change it here, then run:      ./build.py
#
#  Not sure which setting is which? Open  map.html  in this folder.
#  It shows every block of text in page order.
#
#  THIS PAGE GOES STALE. It is the handout for an event that runs
#  once a year, and the guides, base code and challenge list are
#  rewritten for each one. Check it before the event starts rather
#  than during - see README.md in this folder.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title comes from _src/super-robo-time.html.
[meta]
description = "Super Robo Time: the annual build event run by the Rocker Robotics Team, UAS and the 3D Print Club at South Dakota Mines, with every guide, diagram and library a team needs."


# --- PAGE HEAD: the band at the top -------------------------------
# No banner photo here. The SRT photo the old page ran across the
# top is now the [feature] band further down, where it can be a wide
# photo without pushing the material below it off the screen.
[page_head]
image     = ""
back_link = "/resources"
back_text = "Resources"
eyebrow   = "Three or four weeks, one robot"
heading   = "Super Robo Time"
body      = "An annual event run with UAS and the 3D Print Club, where anyone who turns up builds a robot to take on a challenge. Everything a team needs while it is running is on this page."


# --- WHAT IT IS ---------------------------------------------------
[what]
eyebrow   = "The event"
heading   = "What Super Robo Time is"
paragraph = [
  "Super Robo Time &mdash; SRT &mdash; is an annual event held by the Robotics Team, UAS and the 3D Print Club. It is a chance to learn about robotics, drones and 3D printing, compete in a scavenger hunt in the labs, and build a robot to complete a challenge.",
  "It generally runs over three to four weeks, with the main workdays on Saturdays and extra workdays and training sessions in between. You do not need to know anything going in, and you do not need to be on any of the three teams.",
]


# --- THE PHOTO BAND -----------------------------------------------
# A wide photo with a navy gradient laid over it, so the text on top
# stays readable whatever the photo is. To change it, put a new wide
# landscape photo in images/ and name it here. Leave `image` empty
# and the band is plain navy, which also reads fine.
#
# stat - the three figures under the text. Each one is
#        [ "the big number", "what it counts" ]. Keep the number
#        short; it is set very large.
[feature]
image   = "super-robo-time.jpg"
heading = "Turn up on a Saturday and build something"
body    = "No experience assumed, no sign-up needed, and nothing to bring. The teams are put together on the first day and everything a robot needs is provided."
stat    = [
  ["3&ndash;4", "weeks long"],
  ["3",         "clubs running it"],
  ["Sat",       "main workdays"],
]


# --- WHAT YOU NEED, STAGE BY STAGE --------------------------------
#
#  Each [[kit.stage]] is one card, in the order a team meets them.
#  The settings are:
#
#    icon   any Font Awesome 4.7 name, without the "fa-" prefix.
#           Browse them at https://fontawesome.com/v4/icons/
#    body   the sentence explaining the stage. Optional.
#    links  the list of links. Each one is [ "the words", "the address" ]
#           and can take a third entry shown in grey after the link.
#    note   plain instructions that are not a link - an install path,
#           a warning. Optional.
#
#  These change from year to year. When the event is rewritten, this
#  is the block to go through link by link.
[kit]
eyebrow = "During the event"
heading = "What you need, in the order you need it"
intro   = "Install the software first &mdash; it is the slowest part and the one worth doing before the first Saturday rather than on it."

[[kit.stage]]
icon    = "laptop"
heading = "Software"
body    = "Two programs, and both take a while to install. Do this at home if you can."
links   = [
  ["SOLIDWORKS from SharePoint", "https://sdsmt0.sharepoint.com/:f:/r/sites/ITS-Install/Shared%20Documents/SOLIDWORKS/SOLIDWORKS%202019?csf=1&amp;web=1&amp;e=IxbYFx"],
  ["Install VS Code",            "https://code.visualstudio.com/Download"],
]
note    = "<strong>SOLIDWORKS:</strong> download all three files into one folder, run the <code>.exe</code>, then run <code>SWinstall.bat</code> once the extract has finished. The older F: drive route was <code>F:\\install\\Solidworks\\Auto SolidWorks Install\\SOLIDWORKS 2019 SP3.0\\</code>."

[[kit.stage]]
icon    = "cube"
heading = "Mechanical"
body    = "The CAD workshop, then the guide to putting the bot together. The wheel drawing is the demonstration part &mdash; the first thing most people draw."
links   = [
  ["Workshop guide document", "https://docs.google.com/document/d/1Rr3UThgfijHwgXaRdHDw8uTjcZ-XsOy7/edit?usp=sharing"],
  ["Workshop CAD files",      "https://drive.google.com/file/d/1zuo3ZcPjxxfCOl1rw60fB0bBxLoim9YP/view?usp=sharing"],
  ["Bot assembly guide",      "https://docs.google.com/document/d/1JfV8HUS_h7BRDEZkhP9dYC9aShK6T9U1/edit#heading=h.gjdgxs"],
  ["Demo part - wheel drawing", "https://drive.google.com/file/d/1G1pMnZUxKfr1s_Gb98g4n5y-0ekNxdgo/view?usp=sharing", "(PDF)"],
]

[[kit.stage]]
icon    = "bolt"
heading = "Electrical"
body    = "How it all wires together, and which pin on the ESP32 is which."
links   = [
  ["Wiring diagram", "https://drive.google.com/file/d/1VCt6hQFq53vnsxfThOBV153jLXwsgCha/view?usp=sharing"],
  ["ESP32 pinout",   "https://cdn.instructables.com/ORIG/FOL/YWLI/JEOILQ5U/FOLYWLIJEOILQ5U.png?auto=webp&amp;frame=1&amp;width=1024&amp;fit=bounds&amp;md=a74a05c18f4b4d9f0db00ec63c7bc3c0"],
]

[[kit.stage]]
icon    = "code"
heading = "Programming"
body    = "Start from the base code rather than an empty sketch &mdash; it already talks to the motors and the phone. The three libraries below are what it expects to find installed."
links   = [
  ["Programming guide",              "https://docs.google.com/document/d/1i2vVdMFBYWKeJn9s9oWgotWs1XReleNooq1EfdoCmVY/edit?usp=sharing"],
  ["Base code on GitLab",            "https://gitlab.com/sdmines/clubs/rocker-robotics/super-robo-time/super-robo-time-code"],
  ["Dabble",                         "https://github.com/STEMpedia/DabbleESP32", "(remote control)"],
  ["L298N",                          "https://github.com/sdsmt-robotics/L298N", "(motor driver)"],
  ["ESP32 AnalogWrite",              "https://github.com/ERROPiX/ESP32_AnalogWrite", "(compatibility)"],
]

[[kit.stage]]
icon    = "flag-checkered"
heading = "Challenges"
body    = "What to try to make your robot actually do. Nobody manages all of them, and that is the point &mdash; pick the ones your team finds interesting."
links   = [
  ["Suggested tasks", "https://drive.google.com/file/d/15gW0fKq-xuPnWwcbfShQ56BFavxMELlY/view?usp=sharing"],
]

[[kit.stage]]
icon      = "cogs"
heading   = "Going further"
body      = "If SRT leaves you wanting to keep building, the parts reference is where the team's opinions about motors, encoders and controllers are written down &mdash; which one to reach for, and what its datasheet does not tell you."
link      = "/resources/robo-parts"
link_text = "Open the parts reference"


# --- CONTACT BAR: the dark band at the bottom ---------------------
[contact_bar]
heading               = "When is the next one?"
body                  = "SRT runs once a year and the dates go on the team calendar as soon as they are set. If it is not on there yet, ask &mdash; planning usually starts well before anything is announced."
primary_button_text   = "Check the calendar"
primary_button_link   = "/calendar"
secondary_button_text = "Ask on Discord"
secondary_button_link = "https://discord.gg/pehkuYRxh6"
