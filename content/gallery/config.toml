# --- MORE TO SEE: the three cards under the album list ------------
[more]
eyebrow = "Beyond the photos"
heading = "The stories behind them"
intro   = "Most of these albums have a write-up somewhere else on the site, and the newest photos never make it here first."

# icon - any Font Awesome 4.7 name, without the "fa-" prefix.
#        Browse them at https://fontawesome.com/v4/icons/

[[more.card]]
icon      = "newspaper-o"
heading   = "News"
body      = "Competition results, outreach events, and newsletters &mdash; the written record that goes with these photographs."
link      = "/news"
link_text = "Read the news"

[[more.card]]
icon      = "cog"
heading   = "Robots"
body      = "Every machine the team has built since 2015, with a write-up on how each one was designed and how it fared."
link      = "/projects"
link_text = "See the robots"

[[more.card]]
icon      = "instagram"
heading   = "Follow along"
body      = "Build photos, competition trips, and whatever is on the bench this week, posted as it happens rather than at the end of the season."
link      = "https://www.instagram.com/rockerrobotics/"
link_text = "See our Instagram"


# --- CONTACT BAR: the dark band at the bottom ---------------------
[contact_bar]
heading               = "Want to be in the next album?"
body                  = "Every photo on this page has somebody in it who turned up to a meeting not knowing much. No experience required &mdash; tell us what you are curious about and we will put a tool in your hand."
primary_button_text   = "Join the team"
primary_button_link   = "/about#join"
secondary_button_text = "Contact us"
secondary_button_link = "mailto:Robotics@mines.sdsmt.edu"
