####################################################################
#  GALLERY PAGE  (sdsmtrobotics.github.io/gallery)
#
#  Everything you can see as text on the gallery page is in this
#  file. Change it here, then run:      ./build.py
#
#  Images live in the images/ folder next to this file. To swap one
#  out, drop the new photo in there and put its filename below.
#
#  Not sure which image is which? Open  map.html  in this folder.
#  It shows every photo and every block of text in page order.
#
#  You can use basic HTML in any text below - <strong>bold</strong>,
#  <em>italics</em>, <br> for a line break, <a href="...">links</a>.
####################################################################


# --- search results and link previews -----------------------------
# The browser tab title comes from _src/gallery.html, not from here.
[meta]
description = "Photos from the South Dakota Mines Rocker Robotics Team - competition trips, outreach events, and a decade of robots in the workshop."


# --- PAGE HEAD: the banner at the top -----------------------------
# Set image = "" for a plain navy band instead of a photo.
[page_head]
image   = "banner.jpg"          # wide landscape photo, 1900px or wider
eyebrow = "A decade in photographs"
heading = "Gallery"
body    = "Thirty-one albums from the workshop, the competition floor, and everywhere the robots have been carried since 2015."


# --- THE ALBUM LIST -----------------------------------------------
[gallery]
eyebrow = "Every album"
heading = "Browse the archive"
intro   = "Newest first. Each card opens the album's own page, where the photos are shown full size."

# The wording on the link at the bottom of every card. Unlike the
# news and robots pages, every card here opens the same kind of
# thing, so there is one setting rather than one per card.
link_text = "Open the album"

# The buttons above the cards. Each one shows only the albums whose
# `category` matches its `value`. Leave `value = ""` for "show all".
#
# If you add an album in a brand new category, add a button for it
# here too - otherwise its card only ever shows under "All albums".

[[gallery.filter]]
label = "All albums"
value = ""

[[gallery.filter]]
label = "Competitions"
value = "competition"

[[gallery.filter]]
label = "Outreach"
value = "outreach"

[[gallery.filter]]
label = "Robots"
value = "robots"

[[gallery.filter]]
label = "Team"
value = "team"


# ------------------------------------------------------------------
#  Each [[gallery.album]] block below is one album, in the order they
#  appear on the page. Copy a block to add an album, delete one to
#  remove it. Put new ones at the TOP - the page runs newest first.
#
#    title     - the album name, shown as the card heading
#    date      - the date line under the name
#    season    - the school year, shown after the date. The old page
#                grouped the albums under these; now each card
#                carries its own.
#    tag       - small gold label in the corner of the photo
#    category  - which filter button shows this card. Must match one
#                of the `value` settings in the buttons above.
#    count     - how many photos are in the album. Shown as the
#                badge in the corner of the cover photo, so keep it
#                in step with the album page itself.
#    blurb     - the summary. Links are allowed.
#    image     - the cover photo: a filename in images/. Leave as ""
#                to show a "photos coming soon" placeholder instead.
#    link      - the album page this card opens.
# ------------------------------------------------------------------

